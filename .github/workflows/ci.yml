name: CI

# Branch pushes without a PR don't run CI; open a (draft) PR to get checks.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.tool-versions'
      - name: npm
        run: npm ci
      - name: lint
        run: npm run lint
      - name: check types
        run: npm run typecheck

  schema:
    runs-on: ubuntu-latest

    env:
      DATABASE_SERVER: postgres://postgres:postgres@localhost:5432

    services:
      postgres:
        image: postgres:15.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_name_snake_development
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.tool-versions'
      - name: npm
        run: npm ci
      - name: run migrations
        run: |
          node ace db:migrate
      - name: check git diff
        run: git diff --exit-code database/types.d.ts

  tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_SERVER: postgres://postgres:postgres@localhost:5432
      NODE_ENV: test

    services:
      postgres:
        image: postgres:15.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_name_snake_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 5

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
      - name: npm
        run: npm ci
      - name: playwright
        run: npx playwright install chromium
      - name: run migrations
        run: |
          node ace db:migrate
      - name: tests
        run: node ace test --coverage-text
      - name: check backend coverage
        run: npx c8 report --check-coverage --reporter=text --reporter=lcovonly
      - name: check front-end coverage
        run: npx nyc report --check-coverage --reporter=text --reporter=lcov
      - name: upload coverage for Sonar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/*/lcov.info
          if-no-files-found: warn

  # Fire-and-forget: hand the analysis off to the Sonar workflow (sonar.yml)
  # and finish. Sonar is not a blocking gate, so it should not hold CI's status
  # open for the length of the scan, or fail CI when its server is down.
  trigger-sonar:
    needs: [tests]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Sonar analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run sonar.yml \
            --ref "$GITHUB_REF_NAME" \
            -f ci_run_id="$GITHUB_RUN_ID" \
            -f sha="$GITHUB_SHA"
